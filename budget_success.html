<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-translate="budget_success_title">Dev.Souza | Budget Success</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-transparent navbar-dark custom-navbar sticky-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}"><img src="{% static 'images/logosouza3.png' %}" width="150" height="150" atl="Dev.Souza"></a>
                <div id="language-switcher" class="language-switcher">
                    <img src="https://img.freepik.com/vetores-gratis/fundo-da-bandeira-americana_23-2147837199.jpg" alt="USA Flag" class="flag active">
                    <img src="https://www.bandeira1.com.br/lojas/00002028/prod/brasil/nova-bordada-inteira.jpg" alt="Brazil Flag" class="flag">
                </div>
            </div>
        </nav>
    </header>

    <section class="success-section py-5 pt-5" style="background-color: #222; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="container text-center">
            <div class="success-card mx-auto p-5 rounded" style="max-width: 700px; background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(8px); box-shadow: 0 0 20px rgba(0,247,255,0.4);">
                <h1 class="display-4" style="color: #00f7ff;" data-translate="success_title">Success!</h1>
                <p class="lead" style="color: #e5e7eb;" data-translate="success_message">Your budget request has been sent successfully. We will get back to you shortly.</p>
                <a href="{% url 'home' %}" class="btn btn-neon mt-3" data-translate="go_to_home">Go to Home</a>
            </div>
        </div>
    </section>

    <script src="{% static 'js/translations.js' %}" async defer></script>
    <script src="{% static 'js/script.js' %}" async defer></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
